<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Controle iPhone ➡️ PC</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --primary-color: #075E54; --secondary-color: #128C7E; --background-color: #f0f2f5; --card-background: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--background-color); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; background: var(--card-background); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { color: var(--primary-color); text-align: center; font-size: 1.4rem; }
        .section-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e0e0e0; }
        textarea, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; margin-top: 5px; }
        textarea { height: 80px; resize: none; }
        button { width: 100%; cursor: pointer; border: none; border-radius: 6px; padding: 14px; font-weight: bold; font-size: 1rem; margin-top: 10px; }
        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-success { background-color: #4CAF50; color: white; }
        .countdown { color: #f44336; font-weight: bold; font-size: 1.3rem; display: block; text-align: center; margin: 10px 0; }
        .status-box { padding: 10px; text-align: center; font-weight: bold; border-radius: 6px; background-color: #ffe082; color: #b78103; }
        .connected { background-color: #c8e6c9; color: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Disparo Híbrido</h1>
    
    <div class="section-box">
        <label><strong>IP Local do seu PC:</strong></label>
        <input type="text" id="pcIp" placeholder="Ex: 192.168.1.50" value="">
        <button class="btn-primary" style="padding: 8px; margin-top: 5px;" onclick="conectarAoPC()">Conectar ao PC</button>
    </div>

    <div id="connectionStatus" class="status-box">Status: Desconectado do PC</div>
    
    <div class="section-box" style="margin-top: 12px;">
        <label><strong>Contatos e Mensagem:</strong></label>
        <textarea id="csvData" placeholder="Luiz	5548999182475"></textarea>
        <textarea id="msgTemplate" placeholder="Olá {nome}!"></textarea>
    </div>
    
    <button class="btn-primary" onclick="processData()">1. Carregar Lista</button>
    <button class="btn-success" id="btnStart" onclick="startAutomation()" disabled>2. INICIAR FLUXO HÍBRIDO</button>
    
    <span id="timerDisplay" class="countdown">Aguardando...</span>
</div>

<script>
    let contacts = [], currentIndex = 0, isRunning = false, socket = null;

    function conectarAoPC() {
        const ip = document.getElementById('pcIp').value.trim();
        if(!ip) return alert("Digite o IP do seu computador!");
        
        // Se conecta com o VS Code rodando no seu PC
        socket = io(`http://${ip}:3000`);
        
        socket.on('connect', () => {
            const box = document.getElementById('connectionStatus');
            box.innerText = "✅ Conectado ao Gateway do PC!";
            box.className = "status-box connected";
        });

        socket.on('clique_feito', () => {
            console.log("PC confirmou que apertou o Enter!");
        });
        
        socket.on('connect_error', () => {
            alert("Não foi possível conectar. Verifique se o seu iPhone está no mesmo Wi-Fi do computador e se o IP está correto.");
        });
    }

    function processData() {
        const rawText = document.getElementById('csvData').value.trim();
        const template = document.getElementById('msgTemplate').value.trim();
        if (!rawText || !template) return alert('Preencha os campos!');

        contacts = rawText.split('\n').map(line => {
            const parts = line.split(line.includes('\t') ? '\t' : ';');
            return { name: parts[0]?.trim(), phone: parts[1]?.replace(/\D/g, ''), message: template.replace(/{nome}/g, parts[0]?.trim()) };
        }).filter(c => c.phone);

        if(contacts.length > 0) document.getElementById('btnStart').disabled = false;
        alert('Lista Pronta!');
    }

    function startAutomation() {
        if(!socket) return alert("Conecte ao PC primeiro!");
        isRunning = true;
        sendNext();
    }

    function sendNext() {
        if (!isRunning || currentIndex >= contacts.length) {
            document.getElementById('timerDisplay').innerText = "✅ Finalizado!";
            return;
        }

        const c = contacts[currentIndex];
        
        // Abre o link do WhatsApp Web no PC utilizando uma janela temporária
        // Mas o truque é: Como o foco vai pro WhatsApp do PC, o robô vai agir lá!
        const url = `https://web.whatsapp.com/send?phone=${c.phone}&text=${encodeURIComponent(c.message)}`;
        window.open(url, '_blank');

        // Conta 8 segundos para a página carregar no navegador e chama o clique do PC
        let seconds = 8;
        const interval = setInterval(() => {
            seconds--;
            document.getElementById('timerDisplay').innerText = `Carregando chat: ${seconds}s`;
            if (seconds <= 0) {
                clearInterval(interval);
                
                // MANDA O COMANDO PRO VS CODE DO SEU PC APERTAR ENTER!
                socket.emit('solicitar_clique');
                
                currentIndex++;
                
                // Espera mais 4 segundos de folga pós-envio e vai para o próximo número
                setTimeout(sendNext, 4000);
            }
        }, 1000);
    }
</script>

</body>
</html>
