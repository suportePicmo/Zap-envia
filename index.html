<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Controle Híbrido V4 - Excel Direct</title>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-color: #075E54;
            --secondary-color: #128C7E;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --text-color: #333333;
            --success-color: #4CAF50;
            --danger-color: #f44336;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--background-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: var(--card-background); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { color: var(--primary-color); text-align: center; font-size: 1.4rem; margin-bottom: 15px; }
        .section-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e0e0e0; }
        textarea, input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; margin-top: 5px; }
        textarea { height: 90px; resize: none; }
        input[type="file"] { background: white; cursor: pointer; }
        .status-connection { padding: 10px; text-align: center; font-weight: bold; border-radius: 6px; background-color: #ffe082; color: #b78103; margin-bottom: 12px; font-size: 0.9rem; }
        .connected { background-color: #c8e6c9; color: #2e7d32; }
        button { width: 100%; cursor: pointer; border: none; border-radius: 6px; padding: 14px; font-weight: bold; font-size: 1rem; margin-top: 8px; transition: background 0.2s; }
        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; font-size: 1.1rem; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .countdown { color: var(--danger-color); font-weight: bold; font-size: 1.4rem; display: block; text-align: center; margin: 15px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; }
        tr.active-row { background-color: #e8f5e9; font-weight: bold; }
        .status { padding: 3px 8px; border-radius: 3px; font-weight: bold; font-size: 0.8rem; }
        .status-pendente { background-color: #ffe082; color: #b78103; }
        .status-processado { background-color: #c8e6c9; color: #2e7d32; }
        .hint { font-size: 0.8rem; color: #666; margin-top: 4px; display: block; }
        
        /* Modal de Sucesso */
        .success-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; color: white; text-align: center; }
        .success-box { background: white; color: #333; padding: 30px; border-radius: 12px; max-width: 80%; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Disparos Híbrido</h1>
    
    <div class="section-box">
        <label><strong>1. Vincular IP Local do seu PC:</strong></label>
        <input type="text" id="pcIp" placeholder="Exemplo: 192.168.1.15">
        <button class="btn-primary" style="padding: 10px;" onclick="conectarAoPC()">Conectar com o PC</button>
    </div>

    <div id="connectionStatus" class="status-connection">Status: Desconectado do Computador</div>

    <div class="section-box">
        <label><strong>2. Importar Arquivo do Excel:</strong></label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <span class="hint">A planilha deve ter: Coluna A = Nome | Coluna B = Telefone</span>
    </div>

    <div class="section-box">
        <label><strong>3. Mensagem Customizada:</strong></label>
        <textarea id="msgTemplate" placeholder="Olá {nome}, sua mensagem aqui!"></textarea>
        <button class="btn-primary" onclick="processExcel()">Carregar Dados do Excel</button>
    </div>

    <div class="section-box" style="background: #e8f5e9;">
        <span id="timerDisplay" class="countdown">Aguardando Início...</span>
        <button class="btn-success" id="btnStart" onclick="startAutomation()" disabled>▶️ INICIAR ENVIOS (15s)</button>
        <button class="btn-danger" onclick="stopAutomation()">⏸️ PARAR TUDO</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="3" style="text-align:center; color:#777;">Nenhuma planilha importada.</td></tr>
        </tbody>
    </table>
</div>

<div id="successModal" class="success-screen">
    <div class="success-box">
        <h2 style="color: var(--success-color); margin-top: 0;">🎉 DISPARO CONCLUÍDO!</h2>
        <p style="font-size: 1.1rem; font-weight: 500;">Todas as mensagens da sua lista do Excel foram enviadas com sucesso absoluto!</p>
        <button class="btn-primary" onclick="fecharModal()" style="margin-top: 15px;">Ok, Fechar</button>
    </div>
</div>

<script>
    let contacts = [], currentIndex = 0, isRunning = false, socket = null, countdownId = null;

    function conectarAoPC() {
        const ip = document.getElementById('pcIp').value.trim();
        if(!ip) return alert("Por favor, digite o IP do seu computador!");
        
        socket = io(`http://${ip}:3000`);
        
        socket.on('connect', () => {
            const box = document.getElementById('connectionStatus');
            box.innerText = "✅ CONECTADO AO GATEWAY DO PC!";
            box.className = "status-connection connected";
        });
        
        socket.on('connect_error', () => {
            alert("Erro de conexão! Valide se o iPhone está no mesmo Wi-Fi do computador.");
        });
    }

    function processExcel() {
        const fileInput = document.getElementById('excelFile');
        const template = document.getElementById('msgTemplate').value.trim();

        if (!fileInput.files.length) return alert('Por favor, selecione um arquivo Excel primeiro!');
        if (!template) return alert('Por favor, digite uma mensagem padrão!');

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Pega a primeira aba da planilha
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Converte as linhas em formato de matriz [[ColunaA, ColunaB], [ColunaA, ColunaB]]
            const sheetData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            // Mapeia pulando linhas vazias
            contacts = sheetData.map(row => {
                const nomeCliente = row[0] ? String(row[0]).trim() : 'Cliente';
                const telefoneCliente = row[1] ? String(row[1]).trim().replace(/\D/g, '') : '';
                return {
                    name: nomeCliente,
                    phone: telefoneCliente,
                    message: template.replace(/{nome}/g, nomeCliente),
                    status: 'Pendente'
                };
            }).filter(c => c.phone !== ''); // Remove linhas sem telefone válido

            if(contacts.length === 0) {
                return alert('Nenhum contato válido encontrado. Certifique-se de que os números estão na segunda coluna (Coluna B).');
            }

            currentIndex = 0;
            document.getElementById('btnStart').disabled = false;
            renderTable();
            document.getElementById('timerDisplay').innerText = `${contacts.length} Contatos Carregados!`;
            alert(`Sucesso! ${contacts.length} contatos lidos do Excel.`);
        };

        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        contacts.forEach((c, i) => {
            const tr = document.createElement('tr');
            if (i === currentIndex && isRunning) tr.className = 'active-row';
            tr.innerHTML = `<td>${c.name}</td><td>${c.phone}</td><td><span class="status ${c.status === 'Pendente' ? 'status-pendente' : 'status-processado'}">${c.status}</span></td>`;
            tbody.appendChild(tr);
        });
    }

    function startAutomation() {
        if(!socket || !socket.connected) return alert("Vincule ao computador antes de iniciar!");
        if(!contacts.length) return;
        isRunning = true;
        document.getElementById('btnStart').disabled = true;
        runLoop();
    }

    function runLoop() {
        if (!isRunning) return;

        if (currentIndex >= contacts.length) {
            stopAutomation();
            document.getElementById('timerDisplay').innerText = "✅ Concluído!";
            document.getElementById('successModal').style.display = 'flex';
            return;
        }

        renderTable();
        const currentContact = contacts[currentIndex];
        
        socket.emit('abrir_e_enviar', {
            name: currentContact.name,
            phone: currentContact.phone,
            message: currentContact.message
        });

        contacts[currentIndex].status = 'Processado';
        currentIndex++;

        startCountdown(15); // Intervalo fixo de 15 segundos solicitado
    }

    function startCountdown(seconds) {
        clearInterval(countdownId);
        document.getElementById('timerDisplay').innerText = `Próximo em: ${seconds}s`;
        
        countdownId = setInterval(() => {
            seconds--;
            document.getElementById('timerDisplay').innerText = `Próximo em: ${seconds}s`;
            if (seconds <= 0) {
                clearInterval(countdownId);
                runLoop();
            }
        }, 1000);
    }

    function stopAutomation() {
        isRunning = false;
        clearInterval(countdownId);
        document.getElementById('timerDisplay').innerText = "⏸️ Pausado";
        document.getElementById('btnStart').disabled = false;
        renderTable();
    }

    function fecharModal() {
        document.getElementById('successModal').style.display = 'none';
    }
</script>

</body>
</html>
