<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Disparos Direto - WA</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f2f2f7; padding: 20px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto 20px auto; }
        h2 { color: #00a884; text-align: center; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #1c1c1e; }
        textarea { width: 100%; height: 100px; border: 1px solid #c7c7cc; border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 16px; font-family: inherit; resize: vertical; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #c7c7cc; font-size: 16px; background-color: white; margin-bottom: 10px; }
        input[type="file"] { margin-bottom: 10px; font-size: 14px; }
        button { width: 100%; background-color: #007aff; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: #00a884; }
        .status-msg { font-size: 14px; color: #666; font-style: italic; margin-top: 5px; margin-bottom: 15px; }
        .grid-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Estilos da nova lista de contatos */
        .contato-card { background-color: #f9f9f9; border: 1px solid #e5e5ea; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .contato-nome { font-size: 18px; font-weight: bold; color: #1c1c1e; margin-bottom: 5px; }
        .contato-numero { font-size: 14px; color: #666; margin-bottom: 10px; }
        .btn-enviar-zap { background-color: #25D366; border-radius: 8px; padding: 12px; font-size: 15px; display: block; text-align: center; text-decoration: none; color: white; font-weight: bold; }
        .btn-enviado { background-color: #8e8e93 !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>Disparador Inteligente Web</h2>
    
    <label>1. Selecione a Planilha (.xlsx ou .xls)</label>
    <input type="file" id="fileExcel" accept=".xlsx, .xls" onchange="processarArquivoExcel()" />
    <div id="txtStatusPlanilha" class="status-msg">Nenhuma planilha carregada.</div>

    <div id="areaColunas" style="display: none;" class="grid-colunas">
        <div>
            <label>Coluna do Telefone:</label>
            <select id="selectTel"></select>
        </div>
        <div>
            <label>Coluna do Nome:</label>
            <select id="selectNome"></select>
        </div>
    </div>

    <label>2. Mensagem Personalizada</label>
    <textarea id="txtMensagem">Olá {Nome}, tudo bem? Esta é uma mensagem automática.</textarea>
    <div class="status-msg" style="margin-top:-10px; margin-bottom:15px;">Use {Nome} para puxar o nome da planilha.</div>

    <button class="btn-success" onclick="gerarPainelDeEnvios()">3. GERAR LISTA DE DISPAROS</button>
</div>

<div class="card" id="areaListaContatos" style="display: none;">
    <h3 style="text-align: center; color: #1c1c1e; margin-top: 0;">Lista de Contatos</h3>
    <div class="status-msg" style="text-align: center;">Clique em enviar, confirme no WhatsApp e volte para o próximo.</div>
    
    <div id="listaDinamica"></div>
</div>

<script>
    let dadosPlanilhaJson = [];

    function processarArquivoExcel() {
        const input = document.getElementById('fileExcel');
        const status = document.getElementById('txtStatusPlanilha');
        
        if (!input.files || input.files.length === 0) return;
        
        const arquivo = input.files[0];
        const leitor = new FileReader();
        
        leitor.onload = function(e) {
            const dados = new Uint8Array(e.target.result);
            const livro = XLSX.read(dados, { type: 'array' });
            const primeiraAba = livro.SheetNames[0];
            const abaOriginal = livro.Sheets[primeiraAba];
            
            dadosPlanilhaJson = XLSX.utils.sheet_to_json(abaOriginal);
            
            if (dadosPlanilhaJson.length === 0) {
                alert("A planilha está vazia!");
                return;
            }
            
            const colunas = Object.keys(dadosPlanilhaJson[0]);
            const selectTel = document.getElementById('selectTel');
            const selectNome = document.getElementById('selectNome');
            
            selectTel.innerHTML = ''; selectNome.innerHTML = '';
            
            colunas.forEach(col => {
                let opt1 = document.createElement('option'); opt1.value = col; opt1.innerText = col;
                selectTel.appendChild(opt1);
                
                let opt2 = document.createElement('option'); opt2.value = col; opt2.innerText = col;
                selectNome.appendChild(opt2);
                
                if (col.toLowerCase().includes('tel') || col.toLowerCase().includes('num')) selectTel.value = col;
                if (col.toLowerCase().includes('nome') || col.toLowerCase().includes('cliente')) selectNome.value = col;
            });
            
            status.innerText = `Sucesso! ${dadosPlanilhaJson.length} contatos encontrados.`;
            status.style.color = "#00a884";
            document.getElementById('areaColunas').style.display = 'grid';
        };
        
        leitor.readAsArrayBuffer(arquivo);
    }

    function gerarPainelDeEnvios() {
        const mensagemBase = document.getElementById("txtMensagem").value.trim();
        const colTel = document.getElementById("selectTel").value;
        const colNome = document.getElementById("selectNome").value;

        if (dadosPlanilhaJson.length === 0) {
            alert("Carregue uma planilha primeiro!"); return;
        }

        let htmlLista = "";
        let contatosValidos = 0;

        dadosPlanilhaJson.forEach((linha, index) => {
            if (linha[colTel]) { 
                let nome = linha[colNome] ? String(linha[colNome]).trim() : "Cliente";
                let num = String(linha[colTel]).replace('.0', '').trim().replace(/\D/g, '');
                
                if (num.length >= 10 && !num.startsWith("55")) num = "55" + num;
                
                if (num.length >= 12) {
                    contatosValidos++;
                    let msgPersonalizada = mensagemBase.replace(/{Nome}/g, nome);
                    
                    // O Link Oficial da API do WhatsApp que faz toda a mágica:
                    let linkWhatsApp = `https://wa.me/${num}?text=${encodeURIComponent(msgPersonalizada)}`;
                    
                    htmlLista += `
                        <div class="contato-card">
                            <div class="contato-nome">${nome}</div>
                            <div class="contato-numero">📞 +${num}</div>
                            <a href="${linkWhatsApp}" target="_blank" onclick="marcarComoEnviado(this)" style="text-decoration: none;">
                                <div class="btn-enviar-zap">🟢 ENVIAR MENSAGEM</div>
                            </a>
                        </div>
                    `;
                }
            }
        });

        if (contatosValidos === 0) {
            alert("Nenhum número válido encontrado na coluna selecionada."); return;
        }

        document.getElementById("listaDinamica").innerHTML = htmlLista;
        document.getElementById("areaListaContatos").style.display = "block";
        
        // Rola a tela para baixo até a lista
        document.getElementById("areaListaContatos").scrollIntoView({ behavior: 'smooth' });
    }

    // Função que muda a cor do botão para você saber quem já foi
    function marcarComoEnviado(elemento) {
        let botao = elemento.querySelector('.btn-enviar-zap');
        botao.classList.add('btn-enviado');
        botao.innerText = '✔️ ABERTO NO WHATSAPP';
    }
</script>

</body>
</html>
